<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>离散傅里叶外轮环画板</title>
  <style>
    :root {
      --bg: #08090c;
      --line: rgba(255, 255, 255, 0.08);
      --text: #c8ced6;
      --muted: #6d7580;
      --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, monospace;
      --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    #brand {
      position: fixed;
      top: 22px;
      left: 24px;
      z-index: 2;
      pointer-events: none;
    }

    .brand-kicker {
      font-size: 9px;
      letter-spacing: 0.34em;
      color: rgba(180, 196, 210, 0.42);
      font-family: var(--mono);
    }

    .brand-title {
      margin-top: 5px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: rgba(220, 226, 232, 0.72);
    }

    #hint {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.4s ease;
    }

    #hint.hidden { opacity: 0; visibility: hidden; }

    .hint-copy {
      text-align: center;
      transform: translateY(-18px);
    }

    .hint-copy h2 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: rgba(230, 236, 242, 0.72);
    }

    .hint-copy p {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    #dock {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 8px 8px;
      background: rgba(10, 11, 14, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      backdrop-filter: blur(16px) saturate(1.15);
      -webkit-backdrop-filter: blur(16px) saturate(1.15);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    .sep {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    button, select {
      font-family: inherit;
      color: inherit;
    }

    #btn-redraw {
      height: 30px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: #d5dbe2;
      font-size: 11px;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease, color 0.22s ease;
    }

    #btn-redraw:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    #btn-redraw:active { transform: translateY(0); }

    .icon-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 30px;
      padding: 0 8px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .icon-toggle input { display: none; }

    .switch {
      width: 26px;
      height: 14px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
      transition: background 0.2s ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #c9d0d8;
      transition: transform 0.2s ease;
    }

    .icon-toggle input:checked + .switch {
      background: rgba(160, 210, 230, 0.45);
    }

    .icon-toggle input:checked + .switch::after {
      transform: translateX(12px);
      background: #0b0c10;
    }

    .icon-toggle:has(input:checked) { color: #d7dee6; }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 4px;
      min-width: 118px;
    }

    .slider-wrap em {
      font-style: normal;
      font-family: var(--mono);
      font-size: 10px;
      color: #9aa3ad;
      min-width: 1.6em;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 88px;
      height: 2px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e6eaee;
      border: 0;
      cursor: pointer;
      transition: transform 0.18s ease;
    }

    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: 0;
      border-radius: 50%;
      background: #e6eaee;
      cursor: pointer;
    }

    input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.12); }
    input[type="range"]:disabled { opacity: 0.28; }

    select {
      height: 30px;
      padding: 0 8px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: transparent;
      color: #c5ccd4;
      font-size: 11px;
      letter-spacing: 0.06em;
      outline: none;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    select:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    select option { background: #121318; color: #e6eaee; }

    .seg {
      display: flex;
      align-items: center;
      padding: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
    }

    .seg button {
      height: 24px;
      padding: 0 10px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #7b838d;
      font-size: 10px;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.22s ease, color 0.22s ease, transform 0.22s ease;
    }

    .seg button:hover {
      color: #d5dbe3;
      transform: translateY(-0.5px);
    }

    .seg button.active {
      background: rgba(255, 255, 255, 0.1);
      color: #eef2f6;
    }

    button:focus-visible,
    select:focus-visible,
    input[type="range"]:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.28);
      outline-offset: 2px;
    }

    @media (max-width: 980px) {
      #dock {
        flex-wrap: wrap;
        justify-content: center;
        width: min(520px, calc(100vw - 20px));
        border-radius: 22px;
        bottom: 12px;
        gap: 8px;
        padding: 8px;
      }
      .sep { display: none; }
      .slider-wrap { min-width: 100px; }
      #hint .hint-copy { transform: translateY(-48px); }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="brand">
    <div class="brand-kicker">FOURIER</div>
    <div class="brand-title">外轮环</div>
  </div>

  <div id="hint">
    <div class="hint-copy">
      <h2>按住鼠标左键开始绘制</h2>
      <p>松开后轨迹将平滑闭合，并以傅里叶外轮环还原</p>
    </div>
  </div>

  <div id="dock">
    <button id="btn-redraw" type="button">重新绘制</button>
    <span class="sep"></span>
    <label class="icon-toggle" title="圆环可见性">
      <input id="toggle-circles" type="checkbox" checked />
      <span class="switch"></span>
      圆环
    </label>
    <span class="sep"></span>
    <div class="slider-wrap" title="圆环数量">
      <em id="circle-count">40</em>
      <input id="slider-circles" type="range" min="1" max="280" value="40" disabled />
    </div>
    <span class="sep"></span>
    <select id="preset" aria-label="预设图形">
      <option value="">自由绘制</option>
      <option value="heart">心形</option>
      <option value="star">五角星</option>
      <option value="butterfly">蝴蝶</option>
    </select>
    <span class="sep"></span>
    <div class="seg" id="style-seg" role="radiogroup" aria-label="轨迹风格">
      <button type="button" data-style="comet" class="active" title="彗星流光">彗星流光</button>
      <button type="button" data-style="velocity" title="动态速度流场">速度流场</button>
      <button type="button" data-style="aurora" title="呼吸极光">呼吸极光</button>
    </div>
  </div>

  <script>
    const SAMPLE_COUNT = 280;
    const ORBIT_RES = 720;
    const TWO_PI = Math.PI * 2;
    const PERIOD = 10.5;
    const MIN_DRAW_LENGTH = 40;
    const SUB_DT = 1 / 240;

    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
    const hintEl = document.getElementById("hint");
    const slider = document.getElementById("slider-circles");
    const sliderLabel = document.getElementById("circle-count");
    const toggleCircles = document.getElementById("toggle-circles");
    const presetSelect = document.getElementById("preset");
    const btnRedraw = document.getElementById("btn-redraw");
    const styleSeg = document.getElementById("style-seg");

    const state = {
      mode: "drawing",
      cssW: 0,
      cssH: 0,
      drawing: false,
      raw: [],
      samples: [],
      coeffs: [],
      orbit: [],
      termCount: 40,
      showCircles: true,
      style: "comet",
      t: 0,
      clock: 0,
      fullLoop: false,
      lastTs: 0
    };

    function setupCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      state.cssW = window.innerWidth;
      state.cssH = window.innerHeight;
      canvas.width = Math.round(state.cssW * dpr);
      canvas.height = Math.round(state.cssH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function lerpPt(a, b, t) {
      return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) };
    }

    function pointerPos(e) {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    function pathLength(points, closed) {
      let total = 0;
      for (let i = 1; i < points.length; i++) total += dist(points[i - 1], points[i]);
      if (closed && points.length > 1) total += dist(points[points.length - 1], points[0]);
      return total;
    }

    function closePath(points) {
      if (points.length < 2) return points.slice();
      const pts = points.slice();
      if (dist(pts[0], pts[pts.length - 1]) < 2) pts.pop();
      return pts;
    }

    function crUniform(p0, p1, p2, p3, t) {
      const t2 = t * t;
      const t3 = t2 * t;
      return {
        x: 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * ((2 * p1.y) + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
      };
    }

    function tj(ti, a, b, alpha) {
      return ti + Math.pow(Math.max(dist(a, b), 1e-6), alpha);
    }

    function crCentripetal(p0, p1, p2, p3, u, alpha) {
      const t0 = 0;
      const t1 = tj(t0, p0, p1, alpha);
      const t2 = tj(t1, p1, p2, alpha);
      const t3 = tj(t2, p2, p3, alpha);
      const t = t1 + (t2 - t1) * u;
      const a1 = lerpPt(p0, p1, (t - t0) / (t1 - t0));
      const a2 = lerpPt(p1, p2, (t - t1) / (t2 - t1));
      const a3 = lerpPt(p2, p3, (t - t2) / (t3 - t2));
      const b1 = lerpPt(a1, a2, (t - t0) / (t2 - t0));
      const b2 = lerpPt(a2, a3, (t - t1) / (t3 - t1));
      return lerpPt(b1, b2, (t - t1) / (t2 - t1));
    }

    function catmullRomClosed(points, perSeg, centripetal) {
      const n = points.length;
      if (n < 2) return points.slice();
      const out = [];
      for (let i = 0; i < n; i++) {
        const p0 = points[(i - 1 + n) % n];
        const p1 = points[i];
        const p2 = points[(i + 1) % n];
        const p3 = points[(i + 2) % n];
        for (let j = 0; j < perSeg; j++) {
          const u = j / perSeg;
          out.push(centripetal ? crCentripetal(p0, p1, p2, p3, u, 0.5) : crUniform(p0, p1, p2, p3, u));
        }
      }
      return out;
    }

    function resampleClosed(points, n) {
      if (points.length === 1) return Array.from({ length: n }, () => ({ ...points[0] }));
      const pts = points.slice();
      if (dist(pts[pts.length - 1], pts[0]) > 0.4) pts.push({ ...pts[0] });

      const seg = [0];
      let total = 0;
      for (let i = 1; i < pts.length; i++) {
        total += dist(pts[i - 1], pts[i]);
        seg.push(total);
      }
      if (total < 1e-6) return Array.from({ length: n }, () => ({ ...pts[0] }));

      const out = [];
      let idx = 0;
      for (let i = 0; i < n; i++) {
        const target = (i / n) * total;
        while (idx < seg.length - 2 && seg[idx + 1] < target) idx++;
        const a = pts[idx];
        const b = pts[idx + 1];
        const span = seg[idx + 1] - seg[idx] || 1;
        const u = (target - seg[idx]) / span;
        out.push({ x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u });
      }
      return out;
    }

    function dft(points) {
      const N = points.length;
      const coeffs = [];
      for (let k = 0; k < N; k++) {
        let re = 0;
        let im = 0;
        for (let n = 0; n < N; n++) {
          const phi = (TWO_PI * k * n) / N;
          const c = Math.cos(phi);
          const s = Math.sin(phi);
          re += points[n].x * c + points[n].y * s;
          im += points[n].y * c - points[n].x * s;
        }
        re /= N;
        im /= N;
        const freq = k === 0 ? 0 : (k <= N / 2 ? k : k - N);
        coeffs.push({
          re, im, freq,
          amp: Math.hypot(re, im),
          phase: Math.atan2(im, re)
        });
      }
      coeffs.sort((a, b) => b.amp - a.amp || Math.abs(a.freq) - Math.abs(b.freq));
      return coeffs;
    }

    function evalSeries(coeffs, count, t) {
      const n = Math.min(count, coeffs.length);
      let x = 0, y = 0;
      for (let i = 0; i < n; i++) {
        const c = coeffs[i];
        const ang = c.phase + TWO_PI * c.freq * t;
        x += c.amp * Math.cos(ang);
        y += c.amp * Math.sin(ang);
      }
      return { x, y };
    }

    function percentile(sorted, p) {
      const i = (sorted.length - 1) * p;
      const lo = Math.floor(i);
      const hi = Math.min(sorted.length - 1, lo + 1);
      return lerp(sorted[lo], sorted[hi], i - lo);
    }

    function buildOrbit(coeffs, count, samples) {
      const path = new Array(samples);
      for (let i = 0; i < samples; i++) {
        const t = i / samples;
        const p = evalSeries(coeffs, count, t);
        path[i] = { x: p.x, y: p.y, heat: 0 };
      }
      const turns = new Array(samples);
      for (let i = 0; i < samples; i++) {
        const a = path[(i - 1 + samples) % samples];
        const b = path[i];
        const c = path[(i + 1) % samples];
        const v1x = b.x - a.x, v1y = b.y - a.y;
        const v2x = c.x - b.x, v2y = c.y - b.y;
        const l1 = Math.hypot(v1x, v1y) || 1;
        const l2 = Math.hypot(v2x, v2y) || 1;
        const ang = Math.abs(Math.atan2(v1x * v2y - v1y * v2x, v1x * v2x + v1y * v2y));
        const jerk = Math.hypot(v2x / l2 - v1x / l1, v2y / l2 - v1y / l1);
        turns[i] = ang / ((l1 + l2) * 0.5) + jerk * 0.4;
      }
      const blurred = turns.map((_, i) => {
        const a = turns[(i - 1 + samples) % samples];
        const b = turns[i];
        const c = turns[(i + 1) % samples];
        return 0.2 * a + 0.6 * b + 0.2 * c;
      });
      const sorted = blurred.slice().sort((x, y) => x - y);
      const lo = percentile(sorted, 0.18);
      const hi = Math.max(percentile(sorted, 0.93), lo + 1e-6);
      for (let i = 0; i < samples; i++) {
        const n = Math.min(1, Math.max(0, (blurred[i] - lo) / (hi - lo)));
        path[i].heat = Math.pow(n, 1.15);
      }
      return path;
    }

    function orbitAt(t) {
      const path = state.orbit;
      const N = path.length;
      const f = (((t % 1) + 1) % 1) * N;
      const i = Math.floor(f);
      const u = f - i;
      const p0 = path[(i - 1 + N) % N];
      const p1 = path[i % N];
      const p2 = path[(i + 1) % N];
      const p3 = path[(i + 2) % N];
      const p = crUniform(p0, p1, p2, p3, u);
      p.heat = lerp(p1.heat, p2.heat, u);
      return p;
    }

    function startAnimating(points, smooth) {
      const closed = closePath(points);
      const dense = smooth ? catmullRomClosed(closed, 14, true) : closed;
      state.samples = resampleClosed(dense, SAMPLE_COUNT);
      state.coeffs = dft(state.samples);
      slider.max = String(state.coeffs.length);
      slider.disabled = false;
      const preferred = Math.min(state.termCount, state.coeffs.length);
      slider.value = String(preferred);
      state.termCount = preferred;
      sliderLabel.textContent = String(preferred);
      state.orbit = buildOrbit(state.coeffs, state.termCount, ORBIT_RES);
      state.t = 0;
      state.clock = 0;
      state.lastTs = 0;
      state.fullLoop = false;
      state.mode = "animating";
      hintEl.classList.add("hidden");
    }

    function resetToDraw() {
      state.mode = "drawing";
      state.drawing = false;
      state.raw = [];
      state.samples = [];
      state.coeffs = [];
      state.orbit = [];
      state.t = 0;
      state.clock = 0;
      state.fullLoop = false;
      slider.disabled = true;
      presetSelect.value = "";
      hintEl.classList.remove("hidden");
    }

    function fitToCanvas(points, fill) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of points) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      const bw = maxX - minX || 1;
      const bh = maxY - minY || 1;
      const scale = Math.min(state.cssW * fill / bw, state.cssH * fill / bh);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      return points.map((p) => ({
        x: state.cssW / 2 + (p.x - cx) * scale,
        y: state.cssH / 2 + (p.y - cy) * scale
      }));
    }

    function presetHeart() {
      const raw = [];
      for (let i = 0; i < 420; i++) {
        const t = (i / 420) * TWO_PI;
        const s = Math.sin(t);
        raw.push({
          x: 16 * s * s * s,
          y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
        });
      }
      return fitToCanvas(raw, 0.4);
    }

    function presetStar() {
      const verts = [];
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI / 2 + (i * 4 * Math.PI) / 5;
        verts.push({ x: Math.cos(a), y: Math.sin(a) });
      }
      return fitToCanvas(verts, 0.48);
    }

    function presetButterfly() {
      const raw = [];
      const n = 960;
      for (let i = 0; i < n; i++) {
        const t = (i / n) * 12 * Math.PI;
        const p = Math.exp(Math.cos(t)) - 2 * Math.cos(4 * t) - Math.pow(Math.sin(t / 12), 5);
        raw.push({
          x: Math.sin(t) * p,
          y: -Math.cos(t) * p
        });
      }
      return fitToCanvas(raw, 0.62);
    }

    function loadPreset(name) {
      let pts = null;
      let smooth = true;
      if (name === "heart") pts = presetHeart();
      else if (name === "star") { pts = presetStar(); smooth = false; }
      else if (name === "butterfly") pts = presetButterfly();
      if (!pts) return;
      startAnimating(pts, smooth);
    }

    function drawBackground() {
      ctx.fillStyle = "#08090c";
      ctx.fillRect(0, 0, state.cssW, state.cssH);
      const g = ctx.createRadialGradient(
        state.cssW / 2, state.cssH / 2, Math.min(state.cssW, state.cssH) * 0.12,
        state.cssW / 2, state.cssH / 2, Math.max(state.cssW, state.cssH) * 0.78
      );
      g.addColorStop(0, "rgba(8, 9, 12, 0)");
      g.addColorStop(1, "rgba(0, 0, 0, 0.55)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, state.cssW, state.cssH);
    }

    function drawEpicycles(t, count) {
      const n = Math.min(count, state.coeffs.length);
      let x = 0, y = 0;
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      for (let i = 0; i < n; i++) {
        const c = state.coeffs[i];
        const cx = x, cy = y;
        const ang = c.phase + TWO_PI * c.freq * t;
        x += c.amp * Math.cos(ang);
        y += c.amp * Math.sin(ang);
        if (c.freq === 0 || c.amp < 1.1) continue;

        ctx.beginPath();
        ctx.arc(cx, cy, c.amp, 0, TWO_PI);
        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        ctx.lineWidth = 0.6;
        ctx.stroke();

        const last = i === n - 1;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(x, y);
        ctx.strokeStyle = last ? "rgba(100, 200, 255, 0.42)" : "rgba(100, 200, 255, 0.2)";
        ctx.lineWidth = last ? 0.85 : 0.6;
        ctx.stroke();
      }
      ctx.restore();
      return { x, y };
    }

    function drawComet(t) {
      const LEN = 0.2;
      const STEPS = 128;
      const tip = evalSeries(state.coeffs, state.termCount, t);
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      let prev = null;
      for (let i = 0; i <= STEPS; i++) {
        const u = i / STEPS;
        const tt = (t - (1 - u) * LEN + 1) % 1;
        const p = i === STEPS ? tip : orbitAt(tt);
        if (prev) {
          const fade = Math.pow(u, 1.55);
          const w = 0.2 + 2.7 * Math.pow(u, 1.7);
          const r = Math.round(lerp(110, 255, fade));
          const g = Math.round(lerp(170, 255, fade));
          const b = Math.round(lerp(230, 255, fade));
          if (u > 0.72) {
            ctx.strokeStyle = `rgba(255,255,255,${(u - 0.72) * 1.35})`;
            ctx.lineWidth = w + 1.6;
            ctx.beginPath();
            ctx.moveTo(prev.x, prev.y);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
          }
          ctx.strokeStyle = `rgba(${r},${g},${b},${0.03 + 0.94 * fade})`;
          ctx.lineWidth = w;
          ctx.beginPath();
          ctx.moveTo(prev.x, prev.y);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }
        prev = p;
      }
      ctx.restore();
      return tip;
    }

    function drawVelocity(t) {
      const path = state.orbit;
      const N = path.length;
      const drawn = state.fullLoop ? N : Math.max(2, Math.floor(t * N));
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (let i = 0; i < drawn; i++) {
        const a = path[i];
        const b = path[(i + 1) % N];
        const heat = a.heat || 0;
        const r = Math.round(lerp(36, 255, heat));
        const g = Math.round(lerp(96, 58, heat));
        const bch = Math.round(lerp(255, 72, heat));
        ctx.strokeStyle = `rgba(${r},${g},${bch},${0.58 + 0.38 * heat})`;
        ctx.lineWidth = lerp(2.85, 0.65, heat);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      if (!state.fullLoop) {
        const tip = evalSeries(state.coeffs, state.termCount, t);
        const last = path[Math.min(drawn, N - 1)];
        ctx.strokeStyle = "rgba(220, 230, 255, 0.7)";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(tip.x, tip.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawAurora(t) {
      const path = state.orbit;
      const N = path.length;
      const drawn = state.fullLoop ? N : Math.max(2, Math.floor(t * N));
      const flow = t * 1.35;
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = 1.85;
      for (let i = 0; i < drawn; i++) {
        const a = path[i];
        const b = path[(i + 1) % N];
        const wave = 0.5 + 0.5 * Math.sin((i / N + flow) * TWO_PI * 2);
        const pulse = 0.82 + 0.18 * Math.sin(t * TWO_PI * 0.7 + i * 0.02);
        const r = Math.round(lerp(132, 28, wave));
        const g = Math.round(lerp(78, 255, wave));
        const bch = Math.round(lerp(255, 168, wave));
        ctx.strokeStyle = `rgba(${r},${g},${bch},${0.72 * pulse})`;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawNib(x, y, ts) {
      const pulse = 0.5 + 0.5 * Math.sin(ts / 520);
      const r = 9 + pulse * 5;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, "rgba(255,255,255,0.95)");
      g.addColorStop(0.16, `rgba(220,236,255,${0.42 + pulse * 0.16})`);
      g.addColorStop(0.42, `rgba(130,190,255,${0.1 + pulse * 0.07})`);
      g.addColorStop(1, "rgba(120,180,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TWO_PI);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, 1.25 + pulse * 0.25, 0, TWO_PI);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
    }

    function renderDrawing() {
      if (state.raw.length < 2) return;
      ctx.save();
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(170, 200, 220, 0.22)";
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.moveTo(state.raw[0].x, state.raw[0].y);
      for (let i = 1; i < state.raw.length; i++) ctx.lineTo(state.raw[i].x, state.raw[i].y);
      ctx.stroke();
      ctx.strokeStyle = "rgba(220, 232, 240, 0.88)";
      ctx.lineWidth = 1.25;
      ctx.stroke();
      const p = state.raw[state.raw.length - 1];
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.1, 0, TWO_PI);
      ctx.fillStyle = "#f4f7fa";
      ctx.fill();
      ctx.restore();
    }

    function advanceClock(ts) {
      if (!state.lastTs) state.lastTs = ts;
      let dt = (ts - state.lastTs) / 1000;
      state.lastTs = ts;
      if (dt > 0.08) dt = 0.08;
      if (dt < 0) dt = 0;
      let left = dt;
      while (left > 0) {
        const h = left > SUB_DT ? SUB_DT : left;
        state.clock += h;
        left -= h;
      }
      const next = state.clock / PERIOD;
      if (Math.floor(next) > Math.floor(state.t + 1e-9) || next >= 1) state.fullLoop = true;
      state.t = next % 1;
    }

    function render(ts) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawBackground();

      if (state.mode === "drawing") {
        renderDrawing();
      } else if (state.coeffs.length) {
        advanceClock(ts);
        const t = state.t;
        if (state.style === "comet") drawComet(t);
        else if (state.style === "velocity") drawVelocity(t);
        else drawAurora(t);

        let tip;
        if (state.showCircles) tip = drawEpicycles(t, state.termCount);
        else tip = evalSeries(state.coeffs, state.termCount, t);
        drawNib(tip.x, tip.y, ts);
      }

      requestAnimationFrame(render);
    }

    function onPointerDown(e) {
      if (e.button !== undefined && e.button !== 0) return;
      if (state.mode !== "drawing") return;
      canvas.setPointerCapture(e.pointerId);
      state.drawing = true;
      state.raw = [pointerPos(e)];
      hintEl.classList.add("hidden");
    }

    function onPointerMove(e) {
      if (!state.drawing) return;
      const p = pointerPos(e);
      const last = state.raw[state.raw.length - 1];
      if (!last || dist(last, p) >= 1.4) state.raw.push(p);
    }

    function onPointerUp(e) {
      if (!state.drawing) return;
      state.drawing = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
      if (state.raw.length < 8 || pathLength(state.raw, false) < MIN_DRAW_LENGTH) {
        state.raw = [];
        hintEl.classList.remove("hidden");
        return;
      }
      startAnimating(state.raw, true);
    }

    canvas.addEventListener("pointerdown", onPointerDown);
    canvas.addEventListener("pointermove", onPointerMove);
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    btnRedraw.addEventListener("click", resetToDraw);

    toggleCircles.addEventListener("change", () => {
      state.showCircles = toggleCircles.checked;
    });

    slider.addEventListener("input", () => {
      state.termCount = Number(slider.value);
      sliderLabel.textContent = slider.value;
      if (state.coeffs.length) {
        state.orbit = buildOrbit(state.coeffs, state.termCount, ORBIT_RES);
      }
    });

    presetSelect.addEventListener("change", () => {
      const v = presetSelect.value;
      if (!v) return;
      loadPreset(v);
    });

    styleSeg.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-style]");
      if (!btn) return;
      state.style = btn.dataset.style;
      for (const b of styleSeg.querySelectorAll("button")) {
        b.classList.toggle("active", b === btn);
      }
    });

    window.addEventListener("resize", () => {
      const oldW = state.cssW || window.innerWidth;
      const oldH = state.cssH || window.innerHeight;
      setupCanvas();
      const preset = presetSelect.value;
      if (preset && state.mode === "animating") {
        const t = state.t;
        const clock = state.clock;
        const fullLoop = state.fullLoop;
        loadPreset(preset);
        state.t = t;
        state.clock = clock;
        state.fullLoop = fullLoop;
        return;
      }
      const s = Math.min(state.cssW / oldW, state.cssH / oldH);
      const ox = oldW / 2, oy = oldH / 2;
      const nx = state.cssW / 2, ny = state.cssH / 2;
      const scalePts = (arr) => {
        for (const p of arr) {
          p.x = nx + (p.x - ox) * s;
          p.y = ny + (p.y - oy) * s;
        }
      };
      scalePts(state.raw);
      if (state.samples.length) {
        scalePts(state.samples);
        state.coeffs = dft(state.samples);
        state.orbit = buildOrbit(state.coeffs, state.termCount, ORBIT_RES);
      }
    });

    setupCanvas();
    requestAnimationFrame(render);
  </script>
</body>
</html>
