<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面不存在 — 外轮环画板</title>
  <meta name="theme-color" content="#08090c" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #08090c;
      color: #c8ced6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      min-height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    p {
      margin: 0 0 8px;
      letter-spacing: 0.18em;
      font-size: 11px;
      color: #6d7580;
    }
    h1 {
      margin: 0 0 22px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.12em;
    }
    a {
      color: #d5dbe2;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    a:hover { background: rgba(255, 255, 255, 0.06); }
  </style>
</head>
<body>
  <main>
    <div>
      <p>404</p>
      <h1>没有找到这个页面</h1>
      <a href="./">返回画板</a>
    </div>
  </main>

</html>
